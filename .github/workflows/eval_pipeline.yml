name: CI & AST Unit Tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - env:
          PINECONE_API_KEY: "dummy-key-for-unit-tests"
        run: pytest -v tests/
