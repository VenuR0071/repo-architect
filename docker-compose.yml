services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --backend-store-uri sqlite:///mlruns/mlflow.db --default-artifact-root /mlruns --host 0.0.0.0 --port 5000
  repo-architect:
    build: .
    env_file: .env
    depends_on:
      - mlflow
    volumes:
      - .:/workspace
    working_dir: /workspace
